        page: 4
        starts_with: TAREFE was designed to consist of stimuli depicting the emotions of joy, sadness, disgust
      - title: Sample and data collection
        page: 4
        starts_with: The sample consisted of 242 university students (78% women), aged between 18 and 40 years
      - title: Data analysis
        page: 4
