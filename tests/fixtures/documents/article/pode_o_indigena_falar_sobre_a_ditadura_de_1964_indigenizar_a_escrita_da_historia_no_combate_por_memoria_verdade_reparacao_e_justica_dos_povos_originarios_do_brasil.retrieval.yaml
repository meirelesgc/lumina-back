              scope: SPECIFIC_SECTION
              expected_section: 'Resumo'
            fulfilled: true
            evidence:
              - section: 'Resumo'
                page: 1
                contains: 'Analisa-se a potencialidade de uma Comissão Nacional Indígena da Verdade (CNIV) como espaço de reescrita da história das violações de direitos humanos'

          - id: resumo-metodo
            title: Método no resumo
            description: >-
              O resumo descreve o método adotado (desenho, participantes, fontes ou procedimento de análise)?
