# Expected retrieval for pode_o_indigena_falar_sobre_a_ditadura_de_1964_indigenizar_a_escrita_da_historia_no_combate_por_memoria_verdade_reparacao_e_justica_dos_povos_originarios_do_brasil.pdf
# Páginas relativas ao PDF (1 = primeira página). Títulos de seção como no
# .sections.yaml ao lado. Ensaio de história sem seções de método,
# resultados ou discussão: as fontes (a audiência pública de 2022) são
# descritas no Resumo e na seção 4; o argumento se desenvolve nas seções
# 5 e 6; limitações, financiamento e conflitos de interesse não são
# declarados. A disponibilidade de dados está na última página, depois das
# notas, fora de qualquer seção.

tree:
  - typification: Artigo Científico
    taxonomies:

      - title: Resumo
        branches:
          - id: resumo-objetivo
            title: Objetivo no resumo
            description: >-
              O resumo informa o objetivo do estudo?
