                page: 3
                contains: 'É nesse horizonte que se situa este ensaio. A criação da CNIV poderá marcar um ponto de inflexão histórico e historiográfico'
              - section: '1. Introdução'
                page: 4
                contains: 'Com base nas falas da audiência pública de 2022, reflete-se sobre os caminhos de uma (re)escrita indigenizada da história'


