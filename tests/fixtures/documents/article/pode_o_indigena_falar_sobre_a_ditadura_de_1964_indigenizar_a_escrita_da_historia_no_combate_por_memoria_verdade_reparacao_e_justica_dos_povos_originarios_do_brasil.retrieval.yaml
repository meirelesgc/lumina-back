              expected_section: '1. Introdução'
            fulfilled: true
            evidence:
              - section: '1. Introdução'
                page: 2
                contains: 'Os povos indígenas deste território – que viria a ser o Brasil – foram submetidos a um violento processo de conquista, expropriação e desintegração étnico-cultural.'
              - section: '1. Introdução'
                page: 2
                contains: 'os povos indígenas foram as principais vítimas do “milagre econômico” da ditadura militar'
              - section: '1. Introdução'
                page: 3
                contains: 'Na década de 1980, durante a redemocratização, intervieram decisivamente na Assembleia Nacional Constituinte'

          - id: lacuna-justificativa
            title: Lacuna e justificativa
            description: >-
