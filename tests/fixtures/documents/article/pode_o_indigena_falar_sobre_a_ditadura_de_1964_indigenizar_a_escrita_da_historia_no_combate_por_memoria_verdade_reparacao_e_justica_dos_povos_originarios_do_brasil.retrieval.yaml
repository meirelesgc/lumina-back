            fulfilled: false
            evidence:
              - section: 'Resumo'
                page: 1
                contains: 'O artigo realiza um balanço da presença/ausência indígena na Comissão Nacional da Verdade (CNV), bem como discute quem serão o sujeito e o objeto da CNIV.'

          - id: resumo-conclusao
            title: Conclusão no resumo
            description: >-
