            fulfilled: true
            evidence:
              - section: '1. Introdução'
                page: 3
                contains: 'pela primeira vez, os povos indígenas deixariam de ser objetos de relatórios oficiais para tornarem-se sujeitos de uma (re)escrita histórica indigenizada'
              - section: '1. Introdução'
                page: 4
                contains: 'que futuro terá a historiografia quando remodulada pela oralidade indígena em diálogo com documentos oficiais?'

