              expected_section: 'Resumo'
            fulfilled: true
            evidence:
              - section: 'Resumo'
                page: 1
                contains: 'A base documental do artigo é constituída pelos registros orais captados em audiência pública ocorrida no Ministério Público Federal de Minas Gerais em 2022'

          - id: resumo-resultados
            title: Resultados no resumo
