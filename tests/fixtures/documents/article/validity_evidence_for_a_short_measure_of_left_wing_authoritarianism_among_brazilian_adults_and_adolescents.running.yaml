# Cabeçalhos e rodapés corridos de validity_evidence_for_a_short_measure_of_left_wing_authoritarianism_among_brazilian_adults_and_adolescents.pdf
# Salvar como <nome>.running.yaml ao lado do PDF
# Páginas conferidas contra o PDF (1 = primeira página).
#
# Rodapé "Psicologia: Reflexão e Crítica": todas as 23 páginas. Na página 1
# o nome da revista é o banner (conteúdo); na página 22 ele aparece numa
# referência (Vilanova, Milfont & Costa, 2023).
# Cabeçalho das páginas 2 a 23: "Article in Press" e o DOI, alternando os
# lados. Na página 1 "Article in Press" é o rótulo do tipo de artigo e a
# nota "This Article in Press is shared early"; o DOI fecha a página. Na
# página 19 o DOI aparece no texto de "Supplementary Information".
# Os números de página ficam de fora.
# As legendas das tabelas 1, 2 e 5 ficam na margem lateral das páginas 7,
# 9 e 13 e são conteúdo.

running_lines:
  - text: 'Psicologia: Reflexão e Crítica'
    keep_on_pages: [1, 22]
  - text: 'https://doi.org/10.1186/s41155-026-00418-w'
    keep_on_pages: [1, 19]
  - text: 'Article in Press'
    keep_on_pages: [1]

keep_lines:
  - text: 'Table 1 Sociodemographic characterization of the sample (Study 1)'
    page: 7
  - text: 'Table 2 Translation discrepancies and final decisions for the LWA scale (Study 1)'
    page: 9
  - text: 'Table 5 Factor loadings'
    page: 13
