services:
  db:
    image: pgvector/pgvector:pg17
    volumes:
      - dbdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: db_user
      POSTGRES_DB: db
      POSTGRES_PASSWORD: db_password
      TZ: America/Sao_Paulo
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "db_user", "-d", "db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${PORT_DB:-5432}:5432"

  api:
    image: "${COMPOSE_PROJECT_NAME:-lumina}_api"
    entrypoint: ./entrypoint.sh
    ports:
      - "${PORT_API:-8000}:8000"
    environment:
      CACHE_URL: 'redis://redis:6379/0'
      DATABASE_URL: postgresql+psycopg://pg_user:pg_password@db:5432/db
      TZ: America/Sao_Paulo
    env_file: ".env"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - storage:/app/lumina/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:latest
    ports:
      - "${PORT_REDIS:-6379}:6379"
    volumes:
      - cache:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution_api:
    image: gleidsoncosta/evolution-api:v2.3.6
    ports:
      - "${PORT_EVO:-8082}:8080"
    env_file:
      - .evolution.env
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
  storage:
  cache:
  evolution_instances:
