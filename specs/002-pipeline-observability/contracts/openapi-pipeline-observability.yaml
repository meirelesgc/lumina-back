openapi: 3.1.0
info:
  title: Lumina Pipeline Observability API
  version: 1.0.0
  description: >
    API administrativa para consulta e diagnóstico de execuções de pipeline
    (ProcessingRun) e eventos estruturados de observabilidade.
    Acesso estritamente restrito a administradores (role = admin).

paths:
  /processing-runs:
    get:
      summary: Listar execuções de pipeline
      description: >
        Retorna a listagem paginada das execuções do pipeline de release com suporte a
        filtros por status, release_id e document_id.
      operationId: listProcessingRuns
      security:
        - OAuth2PasswordBearer: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Quantidade máxima de execuções retornadas.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Quantidade de registros a pular para paginação.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [in_progress, completed, failed]
          description: Filtro pelo status da execução.
        - name: release_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filtro direto pelo identificador da release (idêntico ao run_id).
        - name: document_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filtro pelo identificador do documento.
      responses:
        '200':
          description: Lista paginada de execuções retornada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingRunListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /processing-runs/{run_id}:
    get:
      summary: Obter detalhes da execução de pipeline
      description: >
        Retorna o detalhamento completo de uma execução através do run_id (compatível e
        idêntico ao release_id), incluindo a sequência dinâmica de etapas executadas,
        durações e a decomposição de critérios paralelos avaliados.
      operationId: getProcessingRunDetail
      security:
        - OAuth2PasswordBearer: []
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador da execução (idêntico ao release_id).
      responses:
        '200':
          description: Detalhes da execução retornados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingRunDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /processing-runs/{run_id}/events:
    get:
      summary: Obter fluxo de eventos atômicos da execução
      description: >
        Retorna a lista cronológica de todos os eventos atômicos persistidos para a
        execução especificada para fins de auditoria detalhada.
      operationId: getProcessingRunEvents
      security:
        - OAuth2PasswordBearer: []
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador da execução (idêntico ao release_id).
      responses:
        '200':
          description: Eventos atômicos retornados com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessingEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          tokenUrl: /auth/sign-in
          scopes: {}

  responses:
    Unauthorized:
      description: Credenciais de autenticação ausentes ou inválidas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Acesso negado. Recurso restrito a administradores.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Execução de pipeline não encontrada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ProcessingStatus:
      type: string
      enum: [in_progress, completed, failed]

    ProcessingRunSummary:
      type: object
      required:
        - id
        - release_id
        - document_id
        - status
        - started_at
        - stages_count
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único da execução (idêntico ao release_id).
        release_id:
          type: string
          format: uuid
          description: Identificador da release processada.
        document_id:
          type: string
          format: uuid
          description: Identificador do documento processado.
        document_name:
          type: string
          nullable: true
          description: Nome do arquivo do documento.
        status:
          $ref: '#/components/schemas/ProcessingStatus'
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          nullable: true
          description: Duração total da execução em milissegundos.
        stages_count:
          type: integer
          description: Quantidade total de etapas registradas.
        error_summary:
          type: string
          nullable: true

    ProcessingRunListResponse:
      type: object
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProcessingRunSummary'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    ProcessingStageDetail:
      type: object
      required:
        - name
        - status
        - started_at
      properties:
        name:
          type: string
          description: >
            Nome dinâmico da etapa (ex: extraction, sections, anonymization,
            embeddings, evaluation, citations, synthesis, ou qualquer etapa futura).
        status:
          $ref: '#/components/schemas/ProcessingStatus'
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          nullable: true
        item_count:
          type: integer
          nullable: true
        error_details:
          type: string
          nullable: true
        items:
          type: array
          description: Subitens avaliados na etapa (ex: critérios em paralelo).
          items:
            type: object
            additionalProperties: true
        metadata:
          type: object
          additionalProperties: true

    ProcessingRunDetail:
      type: object
      required:
        - id
        - release_id
        - document_id
        - status
        - started_at
        - stages
      properties:
        id:
          type: string
          format: uuid
        release_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        document_name:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ProcessingStatus'
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          nullable: true
        error_summary:
          type: string
          nullable: true
        stages:
          type: array
          description: Lista ordenada de etapas do pipeline, renderizadas dinamicamente.
          items:
            $ref: '#/components/schemas/ProcessingStageDetail'
        metadata:
          type: object
          additionalProperties: true

    ProcessingEvent:
      type: object
      required:
        - id
        - run_id
        - event
        - status
        - timestamp
      properties:
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        event:
          type: string
          description: Tipo de evento (ex: run_started, stage_completed, etc.)
        stage:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ProcessingStatus'
        timestamp:
          type: string
          format: date-time
        duration_ms:
          type: integer
          nullable: true
        item_count:
          type: integer
          nullable: true
        error:
          type: string
          nullable: true
        data:
          type: object
          additionalProperties: true

    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
